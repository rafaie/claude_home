<script>
// highlight the current section in the left menu while scrolling
(function () {
  var links = Array.prototype.slice.call(document.querySelectorAll('.sidebar nav a[href^="#"]'));
  if (!links.length) return;
  var map = {};
  links.forEach(function (a) {
    var el = document.getElementById(decodeURIComponent(a.getAttribute('href').slice(1)));
    if (el) map[a.getAttribute('href')] = el;
  });
  function onScroll() {
    var top = window.scrollY + 80, current = null;
    links.forEach(function (a) {
      var el = map[a.getAttribute('href')];
      if (el && el.offsetTop <= top) current = a;
    });
    links.forEach(function (a) { a.classList.toggle('active', a === current); });
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();
</script>
